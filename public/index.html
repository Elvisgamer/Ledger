<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ledger — Family Spending Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Gate: family code + name entry -->
<div id="gate" class="gate">
  <div class="gate-card">
    <div class="gate-mark">§</div>
    <h1>Ledger</h1>
    <p class="gate-sub">Enter your family's code to open the shared ledger. First time? Pick any code — it creates the family.</p>
    <form id="gate-form">
      <label>Family code
        <input id="gate-code" type="text" autocomplete="off" placeholder="e.g. SMITH-HOME" required>
      </label>
      <label>Your name
        <input id="gate-name" type="text" autocomplete="off" placeholder="e.g. Alex" required>
      </label>
      <button type="submit">Open ledger</button>
    </form>
    <p id="gate-error" class="gate-error"></p>
  </div>
</div>

<!-- Main app -->
<div id="app" class="app hidden">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">§</span> Ledger</div>
    <div class="who">
      <span id="who-family" class="who-family"></span>
      <button id="switch-user" class="link-btn">switch</button>
    </div>
  </header>

  <main class="content">

    <section id="view-dashboard" class="view">
      <div class="view-head">
        <h2>Dashboard</h2>
        <div class="scope-toggle" id="scope-toggle">
          <button data-scope="personal" class="scope-btn active">Personal</button>
          <button data-scope="family" class="scope-btn">Family</button>
        </div>
      </div>

      <div id="pending-banner" class="pending-banner hidden">
        <span id="pending-count-text"></span>
        <button id="pending-jump" class="link-btn">confirm now →</button>
      </div>

      <div class="period-grid" id="period-grid"></div>

      <div class="panel">
        <h3>Recent activity</h3>
        <div id="recent-list" class="tx-list"></div>
      </div>
    </section>

    <section id="view-add" class="view hidden">
      <div class="view-head"><h2>Add entry</h2></div>
      <form id="add-form" class="card-form">
        <div class="seg" id="add-type">
          <button type="button" data-val="expense" class="seg-btn active">Expense</button>
          <button type="button" data-val="income" class="seg-btn">Income</button>
        </div>
        <div class="seg" id="add-scope">
          <button type="button" data-val="personal" class="seg-btn active">Personal</button>
          <button type="button" data-val="family" class="seg-btn">Family</button>
        </div>
        <label>Description
          <input id="add-desc" type="text" placeholder="e.g. Groceries" required>
        </label>
        <label>Category
          <input id="add-category" type="text" placeholder="e.g. Food, Rent, Salary" list="cat-list">
          <datalist id="cat-list"></datalist>
        </label>
        <div class="row2">
          <label>Expected amount
            <input id="add-expected" type="number" step="0.01" min="0" placeholder="0.00">
          </label>
          <label>Date
            <input id="add-date" type="date" required>
          </label>
        </div>
        <div class="seg" id="add-status">
          <button type="button" data-val="planned" class="seg-btn active">Just planning</button>
          <button type="button" data-val="paid" class="seg-btn">Already paid</button>
        </div>
        <label id="add-actual-wrap" class="hidden">Actual amount paid
          <input id="add-actual" type="number" step="0.01" min="0" placeholder="0.00">
        </label>
        <button type="submit" class="primary-btn">Add entry</button>
        <p id="add-msg" class="form-msg"></p>
      </form>
    </section>

    <section id="view-recurring" class="view hidden">
      <div class="view-head"><h2>Recurring</h2></div>

      <div class="panel" id="pending-panel">
        <h3>Awaiting confirmation</h3>
        <div id="pending-list" class="stub-list"></div>
        <p id="pending-empty" class="empty-note hidden">Nothing waiting — you're all caught up.</p>
      </div>

      <div class="panel">
        <div class="panel-head-row">
          <h3>Monthly templates</h3>
          <button id="new-recurring-btn" class="link-btn">+ new</button>
        </div>
        <div id="recurring-list" class="tx-list"></div>
      </div>

      <form id="recurring-form" class="card-form hidden">
        <div class="seg" id="rec-type">
          <button type="button" data-val="expense" class="seg-btn active">Expense</button>
          <button type="button" data-val="income" class="seg-btn">Income</button>
        </div>
        <div class="seg" id="rec-scope">
          <button type="button" data-val="personal" class="seg-btn active">Personal</button>
          <button type="button" data-val="family" class="seg-btn">Family</button>
        </div>
        <label>Description
          <input id="rec-desc" type="text" placeholder="e.g. Rent" required>
        </label>
        <label>Category
          <input id="rec-category" type="text" placeholder="e.g. Housing">
        </label>
        <div class="row2">
          <label>Expected amount
            <input id="rec-amount" type="number" step="0.01" min="0" required>
          </label>
          <label>Day of month
            <input id="rec-day" type="number" min="1" max="31" required>
          </label>
        </div>
        <button type="submit" class="primary-btn">Save template</button>
        <p id="rec-msg" class="form-msg"></p>
      </form>
    </section>

    <section id="view-history" class="view hidden">
      <div class="view-head">
        <h2>History</h2>
        <div class="scope-toggle" id="history-scope-toggle">
          <button data-scope="personal" class="scope-btn active">Personal</button>
          <button data-scope="family" class="scope-btn">Family</button>
        </div>
      </div>
      <div id="history-list" class="tx-list"></div>
    </section>

  </main>

  <nav class="tabbar">
    <button data-view="dashboard" class="tab-btn active">
      <span class="tab-icon">◧</span><span>Dashboard</span>
    </button>
    <button data-view="add" class="tab-btn">
      <span class="tab-icon">+</span><span>Add</span>
    </button>
    <button data-view="recurring" class="tab-btn">
      <span class="tab-icon">↻</span><span>Recurring</span>
    </button>
    <button data-view="history" class="tab-btn">
      <span class="tab-icon">≡</span><span>History</span>
    </button>
  </nav>
</div>

<!-- edit/confirm modal -->
<div id="modal" class="modal hidden">
  <div class="modal-card">
    <h3 id="modal-title">Confirm entry</h3>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button id="modal-cancel" class="ghost-btn">Cancel</button>
      <button id="modal-save" class="primary-btn">Save</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
